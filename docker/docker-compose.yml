# Sidecar de capture VR. Démarré par `yarn vr` (dev) ou en CI.
# VR_PROJECT_ROOT est injecté par la CLI (racine du projet hôte à monter sur /work).
services:
  vr-capture:
    image: ${VR_DOCKER_IMAGE:-vr-capture:1.61.1}
    # Image locale uniquement (pas sur Docker Hub) — évite le pull inutile au démarrage.
    pull_policy: never
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PLAYWRIGHT_VERSION: ${PLAYWRIGHT_VERSION:-1.61.1}
    init: true
    volumes:
      # Code du projet hôte (stories, .storybook, vr.config.cjs, baselines).
      - "${VR_PROJECT_ROOT:-..}:/work"
      # node_modules Linux dédié : évite les binaires natifs Mac/Windows incompatibles.
      - vr_node_modules:/work/node_modules
    ports:
      - "${VR_HOST_STORYBOOK_PORT:-6006}:6006" # Storybook (port hôte dérivé du projet)
      - "${VR_HOST_DAEMON_PORT:-2810}:2810" # Daemon de capture (port hôte dérivé du projet)
    environment:
      VR_DOCKER: "1"
      VR_PROJECT_ROOT: /work
      # Chemin absolu hôte (réutilisation sidecar : doit matcher le projet qui lance `vr`).
      VR_HOST_PROJECT_ROOT: "${VR_HOST_PROJECT_ROOT:-}"
      VR_COMPOSE_PROJECT_NAME: "${VR_COMPOSE_PROJECT_NAME:-}"
      VR_CAPTURE_BACKEND: local
      # Résolu hôte : VR_STORYBOOK_MODE → launcher.storybookMode → défaut `dev`.
      VR_STORYBOOK_MODE: "${VR_STORYBOOK_MODE:-dev}"
      # Transmis depuis l'hôte (ex. monorepo : apps/storybook/.storybook).
      SBCONFIG_CONFIG_DIR: "${SBCONFIG_CONFIG_DIR:-}"
      # Auth npm privé (packages @scope restreints) — complémentaire au mount ~/.npmrc.
      NPM_TOKEN: "${NPM_TOKEN:-}"
      NODE_AUTH_TOKEN: "${NODE_AUTH_TOKEN:-}"
    working_dir: /work

volumes:
  vr_node_modules:
