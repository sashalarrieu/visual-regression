name: Publish VR capture image

# Publie l'image de capture VR sur GHCR.
# Tags alignés sur la version Playwright (voir docker/Dockerfile).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      playwright_version:
        description: "Version Playwright (ex. 1.61.1)"
        required: false
        default: "1.61.1"

env:
  IMAGE_NAME: ghcr.io/sashalarrieu/vr-capture
  PLAYWRIGHT_VERSION: ${{ github.event.inputs.playwright_version || '1.61.1' }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: tags
        run: |
          MAJOR_MINOR=$(echo "$PLAYWRIGHT_VERSION" | cut -d. -f1,2)
          {
            echo "tags<<EOF"
            echo "${IMAGE_NAME}:${PLAYWRIGHT_VERSION}"
            echo "${IMAGE_NAME}:${MAJOR_MINOR}"
            echo "${IMAGE_NAME}:latest"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./docker
          file: ./docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            PLAYWRIGHT_VERSION=${{ env.PLAYWRIGHT_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
