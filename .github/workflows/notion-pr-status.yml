# POC gratuit : taguer une page Notion dans la description d’une PR
# → met à jour les propriétés "PR" (URL) et "PR status" (select).
#
# Setup Notion (une fois) :
# 1. Intégration / token avec accès à la base de tickets (secret GitHub NOTION_VR).
# 2. Sur la base : propriétés "PR" (URL) et "PR status" (Select :
#    Open, Draft, Merged, Closed).
# 3. Partager chaque DB / page avec l’intégration Notion.
# 4. Dans la description de la PR, coller l’URL de la page ticket Notion.
#
# Noms de propriétés customisables via les env du job ci-dessous.
name: Notion PR status

on:
  pull_request:
    types:
      - opened
      - reopened
      - edited
      - synchronize
      - ready_for_review
      - converted_to_draft
      - closed

permissions:
  contents: read
  pull-requests: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync PR status to Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_VR }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_HTML_URL: ${{ github.event.pull_request.html_url }}
          PR_STATE: ${{ github.event.pull_request.state }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
          PR_MERGED: ${{ github.event.pull_request.merged }}
          NOTION_PR_URL_PROPERTY: PR
          NOTION_PR_STATUS_PROPERTY: PR status
          NOTION_PR_STATUS_TYPE: select
        run: node .github/scripts/sync-notion-pr-status.mjs
