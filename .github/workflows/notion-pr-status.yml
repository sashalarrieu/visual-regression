# POC : l’état des PRs GitHub est écrit *dans le contenu* du ticket Notion
# (section « GitHub PRs », plusieurs PR possibles par ticket).
#
# Détection du ticket :
# - URL Notion dans la description de la PR, OU
# - ID ticket (ex. TAS-12) dans le titre, la description, la branche ou les commits
#   → lookup sur la propriété Notion « ID » (unique_id)
#
# Secret GitHub requis :
# - NOTION_API_VR  PAT Notion (Développeur)
#
# Bases tickets : tableau NOTION_TICKET_SOURCES dans
# .github/scripts/sync-notion-pr-status.mjs (databaseId + dataSourceId).
#
# Optionnel (env ci-dessous) :
# - NOTION_ID_PREFIX=TAS  pour n’accepter que TAS-123 (ignorer d’autres PREFIX-n)
name: Notion PR status

on:
  pull_request:
    types:
      - opened
      - reopened
      - edited
      - synchronize
      - ready_for_review
      - converted_to_draft
      - closed

permissions:
  contents: read
  pull-requests: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync PR status into Notion ticket content
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_API_VR }}
          NOTION_ID_PROPERTY: ID
          NOTION_ID_PREFIX: VR
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_HTML_URL: ${{ github.event.pull_request.html_url }}
          PR_STATE: ${{ github.event.pull_request.state }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
          PR_MERGED: ${{ github.event.pull_request.merged }}
        run: node .github/scripts/sync-notion-pr-status.mjs
