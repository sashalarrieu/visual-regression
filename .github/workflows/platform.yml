name: Platform validation

# Valide la lib sur macOS et Windows (checks statiques, sans Docker/Storybook).
# Complète ci.yml (ubuntu) pour détecter les régressions spécifiques à une plateforme.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Typecheck
        run: yarn typecheck

      - name: Static VR validation
        run: yarn vr:test-validation --static-only
